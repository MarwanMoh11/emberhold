<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1222">
<title>Emberhold — frontier survival</title>
<!--
  Always revalidate the page itself. GitHub Pages serves HTML with a ~10 minute
  cache, so after a deploy a returning phone happily keeps loading the previous
  build's hashed bundle and the fix looks like it never shipped. The bundle
  filenames are content-hashed, so they stay cached as long as they are valid.
-->
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="description" content="Rebuild a burned frontier outpost, gather by hand, raise an army, and hold the night against the horde.">

<!-- Added to the home screen on iOS, this opens without Safari's chrome. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Emberhold">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  /*
   * Republish the notch and home-indicator insets as custom properties so the
   * game can read them back and keep the HUD out from under iOS chrome.
   */
  :root {
    --sat: env(safe-area-inset-top, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
  }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0d1222;
    /* iOS: no rubber-band scroll, no pull-to-refresh, no double-tap zoom. */
    overscroll-behavior: none;
    touch-action: none;
    -webkit-text-size-adjust: 100%;
    -webkit-user-select: none;
    user-select: none;
  }
  body { font-family: "Gill Sans", "Trebuchet MS", sans-serif; -webkit-tap-highlight-color: transparent; }
  /*
   * --app-h is set only when the page is short of the screen (see main.ts):
   * from the iOS home screen the translucent status bar lifts the page to the
   * top edge but the viewport keeps the bar's height off its bottom.
   */
  #app { position: fixed; inset: 0; height: var(--app-h, auto); touch-action: none; }
  canvas { display: block; touch-action: none; }

  /*
   * Shown until the first frame paints, so a slow phone is not a black screen.
   * It is the title's own dusk — night overhead, an ember horizon — so the
   * hand-off to the painted title is a brightening, not a cut.
   */
  #boot {
    position: fixed; inset: 0; height: var(--app-h, auto); z-index: 5; display: flex; gap: 12px;
    flex-direction: column; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse 80% 45% at 50% 100%, rgba(224,138,68,.55), rgba(224,138,68,0) 70%),
      linear-gradient(#0d1222 0%, #1f1d38 45%, #4a2a3c 75%, #9a4630 100%);
    color: #e9d6b2; font-size: 14px; letter-spacing: .08em; font-style: italic;
  }
  #boot .mark {
    font-family: "Palatino Linotype", Palatino, Georgia, serif; font-style: normal;
    font-size: 40px; font-weight: bold; letter-spacing: .04em;
    color: #f3d487; text-shadow: 0 2px 0 #1a100a, 0 0 18px rgba(255,120,40,.45);
  }
  #boot .rule {
    width: 180px; height: 1px; background: linear-gradient(90deg, transparent, #dcaa45, transparent);
    position: relative;
  }
  #boot .rule::after {
    content: ""; position: absolute; left: 50%; top: -3px; width: 7px; height: 7px;
    background: #dcaa45; transform: translateX(-50%) rotate(45deg);
  }
  #boot.gone { opacity: 0; pointer-events: none; transition: opacity .35s ease; }
  /*
   * A boot that never finishes says so. The splash used to sit on "lighting
   * the fires…" forever when the first frame threw, which is indistinguishable
   * from a slow phone right up until you close the tab.
   */
  #boot-retry {
    display: none; margin-top: 6px; padding: 11px 28px; border-radius: 3px;
    background: linear-gradient(#3e5e98, #264a86 55%, #17305a); color: #fff6e2;
    border: 1px solid #0c0704; box-shadow: inset 0 0 0 2px rgba(233,196,106,.75), 0 2px 5px rgba(8,4,2,.5);
    font: inherit; font-style: normal; font-weight: bold; font-size: 13px; letter-spacing: .14em; cursor: pointer;
  }
  #boot.failed #boot-retry { display: block; }
  #boot.failed #boot-msg {
    color: #ffb49a; max-width: 360px; text-align: center;
    line-height: 1.7; letter-spacing: .04em;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="boot">
  <div class="mark">Emberhold</div>
  <div class="rule"></div>
  <div id="boot-msg">lighting the fires…</div>
  <button id="boot-retry" type="button">TRY AGAIN</button>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
