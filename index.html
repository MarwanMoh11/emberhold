<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1726">
<title>Emberhold — frontier survival</title>
<!--
  Always revalidate the page itself. GitHub Pages serves HTML with a ~10 minute
  cache, so after a deploy a returning phone happily keeps loading the previous
  build's hashed bundle and the fix looks like it never shipped. The bundle
  filenames are content-hashed, so they stay cached as long as they are valid.
-->
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="description" content="Rebuild a burned frontier outpost, gather by hand, raise an army, and hold the night against the horde.">

<!-- Added to the home screen on iOS, this opens without Safari's chrome. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Emberhold">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  /*
   * Republish the notch and home-indicator insets as custom properties so the
   * game can read them back and keep the HUD out from under iOS chrome.
   */
  :root {
    --sat: env(safe-area-inset-top, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
  }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0d1726;
    /* iOS: no rubber-band scroll, no pull-to-refresh, no double-tap zoom. */
    overscroll-behavior: none;
    touch-action: none;
    -webkit-text-size-adjust: 100%;
    -webkit-user-select: none;
    user-select: none;
  }
  body { font-family: Verdana, Geneva, sans-serif; -webkit-tap-highlight-color: transparent; }
  #app { position: fixed; inset: 0; touch-action: none; }
  canvas { display: block; touch-action: none; }

  /* Shown until the first frame paints, so a slow phone is not a black screen. */
  #boot {
    position: fixed; inset: 0; z-index: 5; display: flex; gap: 14px;
    flex-direction: column; align-items: center; justify-content: center;
    background: #0d1726; color: #8fa3bf; font-size: 13px; letter-spacing: .12em;
  }
  #boot .mark { color: #f0b846; font-size: 26px; font-weight: bold; letter-spacing: .2em; }
  #boot.gone { opacity: 0; pointer-events: none; transition: opacity .35s ease; }
  /*
   * A boot that never finishes says so. The splash used to sit on "lighting
   * the fires…" forever when the first frame threw, which is indistinguishable
   * from a slow phone right up until you close the tab.
   */
  #boot-retry {
    display: none; margin-top: 6px; padding: 11px 26px; border-radius: 9px;
    background: #1b2739; color: #e9f1ff; border: 2px solid #33506f;
    font: inherit; font-size: 13px; letter-spacing: .12em; cursor: pointer;
  }
  #boot.failed #boot-retry { display: block; }
  #boot.failed #boot-msg {
    color: #ff8a7a; max-width: 360px; text-align: center;
    line-height: 1.7; letter-spacing: .04em;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="boot">
  <div class="mark">EMBERHOLD</div>
  <div id="boot-msg">lighting the fires…</div>
  <button id="boot-retry" type="button">TRY AGAIN</button>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
