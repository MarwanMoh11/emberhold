name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish rather than cancelling it; a half-published site is worse
# than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # The world v2 preview: the world-v2 branch, built beside the live game at
      # /emberhold/v2/ so it can be played while it is being made. It keeps its
      # own save keys, so it never touches a v1 run. A broken preview must never
      # hold back the live game, hence continue-on-error on both steps.
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: world-v2
          path: v2
      - name: Build the world v2 preview
        continue-on-error: true
        if: hashFiles('v2/package.json') != ''
        working-directory: v2
        run: |
          npm ci
          npx tsc --noEmit
          npx vite build --base=/emberhold/v2/ --outDir ../dist/v2 --emptyOutDir
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
